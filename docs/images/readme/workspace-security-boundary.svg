<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">KamaClaude workspace and security boundary</title>
  <desc id="desc">Builtin filesystem tools are constrained to a canonical workspace and sensitive path policy, while Bash and MCP remain separate weaker trust boundaries.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" class="arrow"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2}.safe{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}.remote{fill:#fef2f2;stroke:#dc2626;stroke-width:2.5}.gate{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arr)}.dash{fill:none;stroke:#ea580c;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arr)}.arrow{fill:#475569}.title{font:700 27px sans-serif;fill:#0f172a}.label{font:700 17px sans-serif;fill:#0f172a}.small{font:14px sans-serif;fill:#475569}.tiny{font:12px sans-serif;fill:#64748b}.red{fill:#b91c1c;font:700 13px sans-serif}
      @media(prefers-color-scheme:dark){.bg{fill:#0b1120}.panel{fill:#111827;stroke:#64748b}.safe{fill:#052e16;stroke:#4ade80}.warn{fill:#431407;stroke:#fb923c}.remote{fill:#450a0a;stroke:#f87171}.gate{fill:#1e1b4b;stroke:#818cf8}.line{stroke:#94a3b8}.dash{stroke:#fb923c}.arrow{fill:#94a3b8}.title,.label{fill:#f8fafc}.small{fill:#cbd5e1}.tiny{fill:#94a3b8}.red{fill:#fca5a5}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text class="title" x="50" y="52">Explicit boundary — not a claim of complete sandboxing</text>

  <rect class="panel" x="45" y="100" width="235" height="135" rx="15"/>
  <text class="label" x="162" y="134" text-anchor="middle">Local client</text>
  <text class="small" x="162" y="162" text-anchor="middle">passes absolute workspace_root</text>
  <text class="small" x="162" y="186" text-anchor="middle">over loopback IPC</text>
  <text class="red" x="162" y="215" text-anchor="middle">trusted client · no authentication</text>

  <rect class="gate" x="360" y="100" width="255" height="135" rx="15"/>
  <text class="label" x="487" y="134" text-anchor="middle">Workspace validation</text>
  <text class="small" x="487" y="162" text-anchor="middle">absolute · exists · directory</text>
  <text class="small" x="487" y="186" text-anchor="middle">resolve(strict=True)</text>
  <text class="tiny" x="487" y="212" text-anchor="middle">canonical root fixed on Session</text>

  <rect class="safe" x="695" y="76" width="455" height="245" rx="18"/>
  <text class="label" x="922" y="112" text-anchor="middle">Builtin filesystem boundary</text>
  <rect class="panel" x="725" y="138" width="125" height="52" rx="10"/>
  <text class="small" x="787" y="169" text-anchor="middle">read_file</text>
  <rect class="panel" x="860" y="138" width="125" height="52" rx="10"/>
  <text class="small" x="922" y="169" text-anchor="middle">list_dir</text>
  <rect class="panel" x="995" y="138" width="125" height="52" rx="10"/>
  <text class="small" x="1057" y="169" text-anchor="middle">write_file</text>
  <text class="small" x="922" y="224" text-anchor="middle">relative path → canonical containment</text>
  <text class="small" x="922" y="248" text-anchor="middle">logical + resolved sensitive-path checks</text>
  <text class="tiny" x="922" y="277" text-anchor="middle">blocks .git · .env* · common keys · credentials</text>
  <text class="tiny" x="922" y="299" text-anchor="middle">TOCTOU is not fully eliminated</text>

  <path class="line" d="M280 167H360"/><path class="line" d="M615 167H695"/>

  <rect class="warn" x="95" y="395" width="440" height="175" rx="17"/>
  <text class="label" x="315" y="432" text-anchor="middle">Bash boundary</text>
  <text class="small" x="315" y="462" text-anchor="middle">starts with cwd = canonical workspace</text>
  <text class="small" x="315" y="488" text-anchor="middle">outside-cwd patterns force permission ASK</text>
  <text class="red" x="315" y="522" text-anchor="middle">not an OS sandbox</text>
  <text class="tiny" x="315" y="548" text-anchor="middle">absolute paths · parent traversal · processes · network remain possible</text>

  <rect class="remote" x="665" y="395" width="440" height="175" rx="17"/>
  <text class="label" x="885" y="432" text-anchor="middle">MCP boundary</text>
  <text class="small" x="885" y="462" text-anchor="middle">stdio / TCP remote tools</text>
  <text class="small" x="885" y="488" text-anchor="middle">errors normalized to safe local taxonomy</text>
  <text class="red" x="885" y="522" text-anchor="middle">not covered by builtin filesystem policy</text>
  <text class="tiny" x="885" y="548" text-anchor="middle">successful content remains untrusted input</text>

  <path class="dash" d="M487 235V350Q487 395 440 395"/>
  <path class="dash" d="M615 210Q640 210 640 350Q640 395 710 395"/>
  <text class="tiny" x="585" y="366" text-anchor="middle">separate trust boundaries</text>
</svg>
