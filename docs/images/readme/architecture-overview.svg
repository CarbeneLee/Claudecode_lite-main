<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">KamaClaude architecture overview</title>
  <desc id="desc">CLI and TUI clients communicate with a local daemon that runs sessions, the agent loop, tools, permissions, subagents, MCP, events, and trace.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="arrow"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.core{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}.accent{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.store{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}.arrow{fill:#475569}.title{font:700 28px sans-serif;fill:#0f172a}.label{font:700 17px sans-serif;fill:#0f172a}.small{font:14px sans-serif;fill:#475569}.tiny{font:12px sans-serif;fill:#64748b}
      @media (prefers-color-scheme: dark){.bg{fill:#0b1120}.panel{fill:#111827;stroke:#64748b}.core{fill:#1e1b4b;stroke:#818cf8}.accent{fill:#083344;stroke:#22d3ee}.store{fill:#052e16;stroke:#4ade80}.warn{fill:#431407;stroke:#fb923c}.line,.dash{stroke:#94a3b8}.arrow{fill:#94a3b8}.title,.label{fill:#f8fafc}.small{fill:#cbd5e1}.tiny{fill:#94a3b8}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <text class="title" x="52" y="55">KamaClaude · observable local coding-agent runtime</text>

  <rect class="panel" x="50" y="105" width="190" height="160" rx="16"/>
  <text class="label" x="145" y="140" text-anchor="middle">Clients</text>
  <rect class="accent" x="78" y="162" width="134" height="38" rx="10"/>
  <text class="small" x="145" y="187" text-anchor="middle">kama CLI</text>
  <rect class="accent" x="78" y="212" width="134" height="38" rx="10"/>
  <text class="small" x="145" y="237" text-anchor="middle">kama-tui</text>

  <rect class="core" x="330" y="90" width="540" height="455" rx="22"/>
  <text class="label" x="600" y="128" text-anchor="middle">kama-core daemon</text>
  <text class="tiny" x="600" y="150" text-anchor="middle">loopback TCP · JSON-RPC 2.0 commands · NDJSON events</text>

  <rect class="panel" x="365" y="180" width="200" height="72" rx="13"/>
  <text class="label" x="465" y="210" text-anchor="middle">SessionManager</text>
  <text class="small" x="465" y="233" text-anchor="middle">workspace · thread · notes</text>

  <rect class="panel" x="635" y="180" width="200" height="72" rx="13"/>
  <text class="label" x="735" y="210" text-anchor="middle">AgentRunner</text>
  <text class="small" x="735" y="233" text-anchor="middle">runtime dependency wiring</text>

  <rect class="accent" x="365" y="300" width="200" height="82" rx="13"/>
  <text class="label" x="465" y="330" text-anchor="middle">AgentLoop</text>
  <text class="small" x="465" y="354" text-anchor="middle">plan → act → observe</text>
  <text class="tiny" x="465" y="373" text-anchor="middle">ExecutionContext</text>

  <rect class="panel" x="635" y="300" width="200" height="82" rx="13"/>
  <text class="label" x="735" y="330" text-anchor="middle">LLM Provider</text>
  <text class="small" x="735" y="354" text-anchor="middle">streaming · tool_use</text>
  <text class="tiny" x="735" y="373" text-anchor="middle">Anthropic</text>

  <rect class="panel" x="365" y="430" width="470" height="82" rx="13"/>
  <text class="label" x="600" y="460" text-anchor="middle">ToolRegistry + invocation pipeline</text>
  <text class="small" x="600" y="484" text-anchor="middle">schema validation · permission · classification · retry</text>
  <text class="tiny" x="600" y="503" text-anchor="middle">one lifecycle boundary for every registered tool</text>

  <rect class="warn" x="950" y="82" width="200" height="92" rx="14"/>
  <text class="label" x="1050" y="113" text-anchor="middle">Builtin tools</text>
  <text class="small" x="1050" y="137" text-anchor="middle">files · bash · tasks</text>
  <text class="tiny" x="1050" y="157" text-anchor="middle">workspace-aware boundaries</text>

  <rect class="accent" x="950" y="202" width="200" height="92" rx="14"/>
  <text class="label" x="1050" y="233" text-anchor="middle">Subagents</text>
  <text class="small" x="1050" y="257" text-anchor="middle">foreground · background</text>
  <text class="tiny" x="1050" y="277" text-anchor="middle">agent_result</text>

  <rect class="panel" x="950" y="322" width="200" height="92" rx="14"/>
  <text class="label" x="1050" y="353" text-anchor="middle">MCP</text>
  <text class="small" x="1050" y="377" text-anchor="middle">stdio · TCP discovery</text>
  <text class="tiny" x="1050" y="397" text-anchor="middle">untrusted remote boundary</text>

  <rect class="store" x="330" y="595" width="540" height="58" rx="14"/>
  <text class="label" x="600" y="620" text-anchor="middle">EventBus → clients · events.jsonl · daemon trace</text>
  <text class="tiny" x="600" y="641" text-anchor="middle">live observation, persistence, replay, debugging</text>

  <path class="line" d="M240 185 H330"/>
  <text class="tiny" x="285" y="172" text-anchor="middle">commands</text>
  <path class="dash" d="M330 225 H255 Q240 225 240 240 V245"/>
  <text class="tiny" x="287" y="244" text-anchor="middle">events</text>
  <path class="line" d="M565 216 H635"/>
  <path class="line" d="M735 252 V300"/>
  <path class="line" d="M635 341 H565"/>
  <path class="line" d="M465 382 V430"/>
  <path class="line" d="M835 470 H905 V128 H950"/>
  <path class="line" d="M905 248 H950"/>
  <path class="line" d="M905 368 H950"/>
  <path class="dash" d="M600 545 V595"/>
</svg>
