<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">KamaClaude subagent lifecycle</title>
  <desc id="desc">A parent agent spawns an isolated child context, chooses foreground or background execution, bridges events, persists child events, and returns results with cancellation propagation.</desc>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" class="arrow"/></marker>
    <style>
      .bg{fill:#f8fafc}.node{fill:#fff;stroke:#94a3b8;stroke-width:2}.parent{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}.child{fill:#ecfeff;stroke:#0891b2;stroke-width:2.5}.ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#ar)}.dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#ar)}.arrow{fill:#475569}.title{font:700 27px sans-serif;fill:#0f172a}.label{font:700 16px sans-serif;fill:#0f172a}.small{font:13px sans-serif;fill:#475569}.tiny{font:12px sans-serif;fill:#64748b}
      @media(prefers-color-scheme:dark){.bg{fill:#0b1120}.node{fill:#111827;stroke:#64748b}.parent{fill:#1e1b4b;stroke:#818cf8}.child{fill:#083344;stroke:#22d3ee}.ok{fill:#052e16;stroke:#4ade80}.warn{fill:#431407;stroke:#fb923c}.line,.dash{stroke:#94a3b8}.arrow{fill:#94a3b8}.title,.label{fill:#f8fafc}.small{fill:#cbd5e1}.tiny{fill:#94a3b8}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text class="title" x="50" y="52">Subagent lifecycle · isolated context, shared observation</text>

  <rect class="parent" x="45" y="115" width="180" height="82" rx="14"/>
  <text class="label" x="135" y="146" text-anchor="middle">Parent AgentLoop</text>
  <text class="small" x="135" y="172" text-anchor="middle">spawn_agent</text>

  <rect class="node" x="285" y="115" width="190" height="82" rx="14"/>
  <text class="label" x="380" y="146" text-anchor="middle">Validate request</text>
  <text class="small" x="380" y="170" text-anchor="middle">schema · depth &lt; 2 · profile</text>

  <rect class="child" x="535" y="88" width="300" height="136" rx="16"/>
  <text class="label" x="685" y="122" text-anchor="middle">Cold-start child runtime</text>
  <text class="small" x="685" y="148" text-anchor="middle">new run_id + ExecutionContext</text>
  <text class="small" x="685" y="172" text-anchor="middle">child EventBus + filtered ToolRegistry</text>
  <text class="tiny" x="685" y="199" text-anchor="middle">global/project context, no parent conversation history</text>

  <rect class="node" x="905" y="115" width="230" height="82" rx="14"/>
  <text class="label" x="1020" y="146" text-anchor="middle">Child AgentLoop</text>
  <text class="small" x="1020" y="170" text-anchor="middle">plan → act → observe</text>

  <path class="line" d="M225 156H285"/><path class="line" d="M475 156H535"/><path class="line" d="M835 156H905"/>

  <rect class="ok" x="190" y="315" width="270" height="115" rx="16"/>
  <text class="label" x="325" y="348" text-anchor="middle">Foreground</text>
  <text class="small" x="325" y="375" text-anchor="middle">parent waits for completion</text>
  <text class="small" x="325" y="400" text-anchor="middle">returns child result directly</text>

  <rect class="warn" x="740" y="315" width="270" height="115" rx="16"/>
  <text class="label" x="875" y="348" text-anchor="middle">Background</text>
  <text class="small" x="875" y="375" text-anchor="middle">returns run_id after lifecycle entry</text>
  <text class="small" x="875" y="400" text-anchor="middle">agent_result polls shared registry</text>

  <path class="line" d="M1020 197V260Q1020 280 990 280H430Q400 280 400 315"/>
  <path class="line" d="M1020 197V315"/>

  <rect class="node" x="70" y="500" width="330" height="76" rx="14"/>
  <text class="label" x="235" y="529" text-anchor="middle">Child events.jsonl</text>
  <text class="small" x="235" y="553" text-anchor="middle">run-local persistence</text>

  <rect class="parent" x="470" y="500" width="330" height="76" rx="14"/>
  <text class="label" x="635" y="529" text-anchor="middle">Parent EventBus</text>
  <text class="small" x="635" y="553" text-anchor="middle">bridged child progress for clients</text>

  <rect class="warn" x="870" y="500" width="270" height="76" rx="14"/>
  <text class="label" x="1005" y="529" text-anchor="middle">Terminal semantics</text>
  <text class="small" x="1005" y="553" text-anchor="middle">finished once · cancellation re-raised</text>

  <path class="dash" d="M685 224V470Q685 500 650 500"/>
  <path class="dash" d="M610 470H235V500"/>
  <path class="dash" d="M760 470H1005V500"/>
</svg>
