<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">KamaClaude tool invocation pipeline</title>
  <desc id="desc">A tool use request passes through registry lookup, schema validation, permission, invocation, error classification, conservative retry, events, and ToolResult feedback.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" class="arrow"/></marker>
    <style>
      .bg{fill:#f8fafc}.node{fill:#fff;stroke:#94a3b8;stroke-width:2}.gate{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.err{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.bus{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.retry{fill:none;stroke:#ea580c;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}.arrow{fill:#475569}.title{font:700 27px sans-serif;fill:#0f172a}.label{font:700 15px sans-serif;fill:#0f172a}.small{font:13px sans-serif;fill:#475569}.tiny{font:12px sans-serif;fill:#64748b}
      @media(prefers-color-scheme:dark){.bg{fill:#0b1120}.node{fill:#111827;stroke:#64748b}.gate{fill:#1e1b4b;stroke:#818cf8}.ok{fill:#052e16;stroke:#4ade80}.err{fill:#431407;stroke:#fb923c}.bus{fill:#083344;stroke:#22d3ee}.line{stroke:#94a3b8}.retry{stroke:#fb923c}.arrow{fill:#94a3b8}.title,.label{fill:#f8fafc}.small{fill:#cbd5e1}.tiny{fill:#94a3b8}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="title" x="50" y="52">One invocation boundary for every registry tool</text>

  <rect class="node" x="45" y="120" width="130" height="70" rx="13"/>
  <text class="label" x="110" y="149" text-anchor="middle">tool_use</text>
  <text class="small" x="110" y="172" text-anchor="middle">name + input</text>

  <rect class="node" x="215" y="120" width="140" height="70" rx="13"/>
  <text class="label" x="285" y="149" text-anchor="middle">Registry lookup</text>
  <text class="small" x="285" y="172" text-anchor="middle">known tool?</text>

  <rect class="gate" x="395" y="120" width="145" height="70" rx="13"/>
  <text class="label" x="467" y="149" text-anchor="middle">Schema validate</text>
  <text class="small" x="467" y="172" text-anchor="middle">params_model</text>

  <rect class="gate" x="580" y="120" width="145" height="70" rx="13"/>
  <text class="label" x="652" y="149" text-anchor="middle">Permission</text>
  <text class="small" x="652" y="172" text-anchor="middle">policy + approval</text>

  <rect class="node" x="765" y="120" width="145" height="70" rx="13"/>
  <text class="label" x="837" y="149" text-anchor="middle">Invoke</text>
  <text class="small" x="837" y="172" text-anchor="middle">120s outer timeout</text>

  <rect class="err" x="950" y="120" width="200" height="70" rx="13"/>
  <text class="label" x="1050" y="149" text-anchor="middle">Classify / normalize</text>
  <text class="small" x="1050" y="172" text-anchor="middle">stable safe error</text>

  <path class="line" d="M175 155H215"/><path class="line" d="M355 155H395"/><path class="line" d="M540 155H580"/><path class="line" d="M725 155H765"/><path class="line" d="M910 155H950"/>

  <rect class="err" x="840" y="270" width="250" height="84" rx="14"/>
  <text class="label" x="965" y="299" text-anchor="middle">Retry decision</text>
  <text class="small" x="965" y="322" text-anchor="middle">transient_error / rate_limited only</text>
  <text class="tiny" x="965" y="342" text-anchor="middle">max 3 attempts total · 2s / 4s backoff</text>
  <path class="line" d="M1050 190V238Q1050 270 1020 270"/>
  <path class="retry" d="M840 312H790Q750 312 750 270V205Q750 190 765 190"/>

  <rect class="bus" x="85" y="410" width="430" height="82" rx="14"/>
  <text class="label" x="300" y="440" text-anchor="middle">Lifecycle events</text>
  <text class="small" x="300" y="464" text-anchor="middle">tool.call_started · tool.call_finished · tool.call_failed</text>
  <text class="tiny" x="300" y="483" text-anchor="middle">TUI/CLI · events.jsonl · trace</text>

  <rect class="ok" x="650" y="410" width="220" height="82" rx="14"/>
  <text class="label" x="760" y="440" text-anchor="middle">ToolResult</text>
  <text class="small" x="760" y="464" text-anchor="middle">content · is_error · error_type</text>

  <rect class="gate" x="930" y="410" width="220" height="82" rx="14"/>
  <text class="label" x="1040" y="440" text-anchor="middle">AgentLoop context</text>
  <text class="small" x="1040" y="464" text-anchor="middle">tool_result feedback</text>

  <path class="line" d="M110 190V380Q110 410 140 410"/>
  <path class="line" d="M837 190V380Q837 410 810 410"/>
  <path class="line" d="M965 354V380Q965 410 870 410"/>
  <path class="line" d="M515 451H650"/><path class="line" d="M870 451H930"/>

  <text class="tiny" x="570" y="395" text-anchor="middle">success or terminal failure</text>
</svg>
